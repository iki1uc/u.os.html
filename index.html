:root {
  --bg: #010304;
  --surface: #041014;
  --surface-2: #06181d;
  --cyan: #22e6ff;
  --green: #2bff9e;
  --amber: #ffd166;
  --line: #0e3a42;
  --ink: #d9f6fb;
  --muted: #7fb0ba;
  --safe-area-inset-top: 0px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #010304;
    --surface: #041014;
    --surface-2: #06181d;
    --cyan: #22e6ff;
    --green: #2bff9e;
    --amber: #ffd166;
    --line: #0e3a42;
    --ink: #d9f6fb;
    --muted: #7fb0ba;
  }
}
html {
  background: var(--bg);
  scroll-behavior: smooth;
}
body {
  font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  background: var(--bg);
  color: var(--ink);
}
::-moz-selection {
  background: rgba(34, 230, 255, 0.35);
  color: #ffffff;
}
::selection {
  background: rgba(34, 230, 255, 0.35);
  color: #ffffff;
}
:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 2px;
}
@keyframes puls {
  0%, 100% {
    opacity: 0.9;
  }
  50% {
    opacity: 0.25;
  }
}
@keyframes dreh {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}
@keyframes blase {
  0% {
    transform: translateY(0);
    opacity: 0;
  }
  15% {
    opacity: 0.9;
  }
  100% {
    transform: translateY(-110px);
    opacity: 0;
  }
}
@keyframes blinken {
  0%, 49% {
    opacity: 1;
  }
  50%, 100% {
    opacity: 0;
  }
}
.dreh-langsam {
  animation: dreh 70s linear infinite;
}
.blase {
  animation: blase 3.4s ease-in infinite;
}
.kristall-glut {
  filter: drop-shadow(0 0 7px rgba(255, 209, 102, 0.95)) drop-shadow(0 0 22px rgba(255, 209, 102, 0.45));
}
.lauefer-glut {
  filter: drop-shadow(0 0 6px rgba(43, 255, 158, 0.95)) drop-shadow(0 0 16px rgba(43, 255, 158, 0.5));
}
