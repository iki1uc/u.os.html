    --a81: #22d3ee;
    --accent: #67e8f9;
  }
}
html, body {
  margin: 0;
  background: var(--bg);
  color: var(--txt);
}
body {
  font-family: Consolas, "SF Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}
/* Squishy / quetschig micro-interactions */
.squish {
  transition: transform 0.28s cubic-bezier(0.34, 1.8, 0.64, 1),
              background-color 0.15s ease, border-color 0.15s ease,
              color 0.15s ease, box-shadow 0.15s ease;
}
.squish:hover {
  transform: scale(1.06);
}
.squish:active {
  transform: scale(0.92);
}
.cell-squish {
  transition: transform 0.22s cubic-bezier(0.34, 2.2, 0.64, 1),
              background-color 0.08s ease, outline-color 0.08s ease;
}
.cell-squish:hover {
  transform: scale(1.18);
}
.cell-squish:active {
  transform: scale(0.82);
}
.log-scroll::-webkit-scrollbar {
  width: 8px;
}
.log-scroll::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 4px;
}
.log-scroll::-webkit-scrollbar-track {
  background: transparent;
}
@keyframes pop-in {
  0% {
    transform: scale(0.96);
    opacity: 0;
  }
  60% {
    transform: scale(1.015);
    opacity: 1;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}
.pop-in {
  animation: pop-in 0.25s cubic-bezier(0.34, 1.6, 0.64, 1) both;
}
@media (min-width: 1024px) {
  .lg\:grid-cols-\[1fr_400px\] {
    grid-template-columns: 1fr 400px;
  }
}
