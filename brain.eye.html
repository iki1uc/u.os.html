  color: var(--muted);
}
.text-\[var\(--warn\)\] {
  color: var(--warn);
}
.text-black {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}
.shadow {
  --tw-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
  --tw-shadow-colored: 0 1px 3px 0 var(--tw-shadow-color), 0 1px 2px -1px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}
.filter {
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}
.transition-colors {
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}
:root {
  --bg: #020604;
  --surface: #06110a;
  --panel: #08160d;
  --panel-2: #0a1d11;
  --ink: #d3ffd9;
  --muted: #6fae7d;
  --faint: #3c6b47;
  --accent: #3dff6e;
  --accent-soft: #1e9e4a;
  --line: #16401f;
  --warn: #ffe066;
  --danger: #ff6b6b;
  --mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #010402;
    --surface: #050e08;
    --panel: #07130b;
    --panel-2: #091a10;
    --ink: #d3ffd9;
    --muted: #6fae7d;
    --faint: #3c6b47;
    --accent: #3dff6e;
    --accent-soft: #1e9e4a;
    --line: #16401f;
    --warn: #ffe066;
    --danger: #ff6b6b;
  }
}
html,
body {
  background: var(--bg);
}
body {
  font-family: var(--mono);
}
@keyframes laufscroll {
  from {
    transform: translateY(0);
  }
  to {
    transform: translateY(-50%);
  }
}
@keyframes pulse-dot {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.2;
  }
}
@keyframes crt {
  0% {
    opacity: 0.985;
  }
  50% {
    opacity: 1;
  }
  100% {
    opacity: 0.99;
  }
}
@keyframes cursorblink {
  0%,
  49% {
    opacity: 1;
  }
  50%,
  100% {
    opacity: 0;
  }
}
.lauf-track {
  animation: laufscroll 36s linear infinite;
}
.lauf-track:hover {
  animation-play-state: paused;
}
.pulse-dot {
  animation: pulse-dot 1.1s steps(2, end) infinite;
}
.cursor-blink {
  animation: cursorblink 1s steps(1, end) infinite;
}
.crt {
  animation: crt 5s ease-in-out infinite;
}
.scanlines {
  background-image: repeating-linear-gradient(
    0deg,
    rgba(61, 255, 110, 0.05) 0 1px,
    transparent 1px 3px
  );
}
.nice-scroll::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
.nice-scroll::-webkit-scrollbar-thumb {
  background: var(--line);
}
.nice-scroll::-webkit-scrollbar-track {
  background: transparent;
}
.hover\:bg-\[var\(--accent\)\]:hover {
  background-color: var(--accent);
}
.hover\:text-\[var\(--danger\)\]:hover {
  color: var(--danger);
}
.hover\:text-black:hover {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}
.active\:bg-\[var\(--accent\)\]:active {
  background-color: var(--accent);
}
.active\:text-black:active {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}
@media (min-width: 640px) {
  .sm\:h-\[330px\] {
    height: 330px;
  }
  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .sm\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .sm\:border-l {
    border-left-width: 1px;
  }
  .sm\:border-t-0 {
    border-top-width: 0px;
  }
  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }
  .sm\:text-\[11px\] {
    font-size: 11px;
  }
  .sm\:text-base {
    font-size: 1rem;
    line-height: 1.5rem;
  }
  .sm\:text-sm {
    font-size: 0.875rem;
    line-height: 1.25rem;
  }
}
@media (min-width: 1024px) {
  .lg\:grid-cols-\[minmax\(0\2c 1fr\)_350px\] {
    grid-template-columns: minmax(0,1fr) 350px;
  }
}
